[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privsentinel"
version = "0.1.0"
description = "Privacy-first Windows endpoint security platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
    "PyOpenGL>=3.1.7",
    "opencv-contrib-python>=4.11,<5",
    "pyttsx3>=2.90",
    "insightface",
    "scikit-image>=0.22,<0.26",
    "onnxruntime",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "ruff>=0.6"]
voice = ["vosk>=0.3.45", "sounddevice>=0.4.6"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
